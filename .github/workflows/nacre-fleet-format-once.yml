name: EXOVANT Fleet Admission — Normalize Once
on:
  push:
    branches:
      - ops/fleet-admit-nacre-lookdev-001
permissions:
  contents: write
concurrency:
  group: fleet-admit-nacre-lookdev-format
  cancel-in-progress: false
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Normalize registry, graph and manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('ops/fleet/registry.json')
          p.write_text(json.dumps(json.loads(p.read_text()), ensure_ascii=False, indent=2) + '\n')
          PY
          python3 tools/fleet_control.py validate
          python3 tools/graphify_project.py
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
      - name: Persist normalized integration and remove one-shot workflow
        run: |
          git config user.name 'EXOVANT Fleet Integrator'
          git config user.email '261643698+rotprods@users.noreply.github.com'
          git rm .github/workflows/nacre-fleet-format-once.yml
          git add ops/fleet/registry.json _project_intelligence/graph.json MANIFEST.json
          git diff --cached --check
          git commit -m 'ops(fleet): normalize Nacre admission projections [skip ci]'
          git push origin HEAD:ops/fleet-admit-nacre-lookdev-001
