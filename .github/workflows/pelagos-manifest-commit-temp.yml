name: Pelagos manifest commit temp
on:
  push:
    branches: [runtime/pelagos-godot-adapter-001]
permissions:
  contents: write
jobs:
  commit-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: runtime/pelagos-godot-adapter-001
      - name: Refresh exact manifest and self-remove
        run: |
          rm .github/workflows/pelagos-manifest-commit-temp.yml
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MANIFEST.json .github/workflows/pelagos-manifest-commit-temp.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(manifest): refresh Pelagos runtime projection"
          git push origin HEAD:runtime/pelagos-godot-adapter-001
