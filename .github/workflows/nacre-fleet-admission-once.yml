name: EXOVANT Fleet Admission — NACRE Lookdev One Shot
on:
  push:
    branches:
      - ops/fleet-admit-nacre-lookdev-001
permissions:
  contents: write
concurrency:
  group: fleet-admit-nacre-lookdev-001
  cancel-in-progress: false
jobs:
  admit-and-reproject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Admit claim with Fleet CAS
        run: |
          python3 - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path('.')
          spec = importlib.util.spec_from_file_location('fleet_control', root / 'tools/fleet_control.py')
          fleet = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fleet)
          path = root / 'ops/fleet/registry.json'
          registry = json.loads(path.read_text())
          claim_id = 'CLM-NACRE-LOOKDEV-HERO-001'
          existing = next((c for c in registry['claims'] if c['id'] == claim_id), None)
          claim = {
              'id': claim_id,
              'owner': 'AGENT-NACRE-LOOKDEV-01',
              'owner_identity_confirmed': True,
              'branch': 'art/nacre-lookdev-hero-001',
              'role': 'world',
              'epoch': 1,
              'status': 'reserved',
              'ack': None,
              'paths': [
                  'production/claims/CLM-NACRE-LOOKDEV-HERO-001.yaml',
                  'art_source/nacre_lookdev_hero/'
              ],
              'scopes': [{'world': 'nacre', 'facet': 'art/lookdev-hero'}],
              'project_ids': [],
              'asset_ids': [
                  'NACRE-LOOK-ARCHIVE-CHAMBER-001',
                  'NACRE-LOOK-SHELL-SURFACE-001',
                  'NACRE-LOOK-BRIDGE-IDENTITY-001',
                  'NACRE-LOOK-MATERIAL-DNA-001',
                  'NACRE-LOOK-TARGET-PACK-001'
              ],
              'evidence_refs': [
                  'https://github.com/rotprods/-/issues/7#issuecomment-5662212641',
                  'https://github.com/rotprods/-/pull/33'
              ],
              'reservation_basis': 'X100 Director rank #1; sibling facet/path/asset collision audit passed against the registry read by this transaction.',
              'includes': [
                  'Nacre look-lock target pack',
                  'archive-chamber hero identity lookdev',
                  'shell/mineral/nacre surface identity',
                  'bridge/docking identity',
                  'image-grounded reconstruction candidates',
                  'cleanup/retopo/PBR/engine/visual-regression contracts'
              ],
              'excludes': [
                  'CLM-NACRE-WORLD-MACRO-001 geometry/source',
                  'planetary scale decisions',
                  'MNEMOS final model/rig',
                  'characters/fauna/vehicles',
                  'gameplay/runtime',
                  'global STATE/PLAN/MANIFEST authority'
              ],
              'worker_status': 'UNKNOWN'
          }
          if existing is None:
              before = fleet.digest(registry)
              registry = fleet.transition(registry, {
                  'action': 'reserve',
                  'expected_digest': before,
                  'claim': claim
              })
              reserved_digest = fleet.digest(registry)
              registry = fleet.transition(registry, {
                  'action': 'ack',
                  'expected_digest': reserved_digest,
                  'claim_id': claim_id,
                  'owner': claim['owner'],
                  'epoch': 1,
                  'evidence_ref': 'https://github.com/rotprods/-/issues/7#issuecomment-5662212641'
              })
              print(json.dumps({'before': before, 'reserved': reserved_digest, 'active': fleet.digest(registry), 'generation': registry['generation']}))
          else:
              if existing.get('owner') != claim['owner'] or existing.get('epoch') != 1 or existing.get('status') != 'active':
                  raise SystemExit('existing claim is not the expected active owner/epoch')
              print(json.dumps({'idempotent': True, 'active': fleet.digest(registry), 'generation': registry['generation']}))
          path.write_text(json.dumps(registry, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
          python3 tools/fleet_control.py validate
      - name: Rebuild graph and continuity manifest
        run: |
          python3 tools/graphify_project.py
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('_project_intelligence/graph.json')
          p.write_text(json.dumps(json.loads(p.read_text()), ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
          python3 tools/project_control.py refresh
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('MANIFEST.json')
          p.write_text(json.dumps(json.loads(p.read_text()), ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
          python3 tools/project_control.py check
      - name: Persist integration and remove one-shot workflow
        run: |
          git config user.name 'EXOVANT Fleet Integrator'
          git config user.email '261643698+rotprods@users.noreply.github.com'
          git rm .github/workflows/nacre-fleet-admission-once.yml
          git add ops/fleet/registry.json _project_intelligence/graph.json MANIFEST.json
          git diff --cached --check
          git commit -m 'ops(fleet): admit Nacre lookdev hero claim [skip ci]'
          git push origin HEAD:ops/fleet-admit-nacre-lookdev-001
