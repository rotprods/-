name: Pelagos manifest refresh temp
on:
  push:
    branches: [runtime/pelagos-godot-adapter-001]
permissions:
  contents: read
jobs:
  refresh-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate final-tree manifest and verify continuity
        run: |
          rm .github/workflows/pelagos-manifest-refresh-temp.yml
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          mkdir -p /tmp/pelagos-manifest
          cp MANIFEST.json /tmp/pelagos-manifest/MANIFEST.json
      - name: Upload generated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pelagos-manifest-refresh-${{ github.sha }}
          path: /tmp/pelagos-manifest/MANIFEST.json
          retention-days: 1
