name: Progress v2 qualify temp
on:
  push:
    branches: [runtime/progress-world-state-v2-001]
permissions:
  contents: read
jobs:
  state-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Acquire pinned Godot
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Execute state v2 migration/recovery suite
        run: |
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_state.gd
