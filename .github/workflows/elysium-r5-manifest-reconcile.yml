name: ELYSIUM R5 one-shot manifest reconcile

on:
  push:
    branches:
      - art/world-elysium-null-001

permissions:
  contents: write

concurrency:
  group: elysium-r5-manifest-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout ELYSIUM owner branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: art/world-elysium-null-001
          fetch-depth: 0

      - name: Reconcile current main and refresh continuity manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          # One-shot infrastructure: remove before canonical manifest generation.
          rm .github/workflows/elysium-r5-manifest-reconcile.yml

          python3 tools/project_control.py refresh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/project_control.py check

          git add -A
          git diff --cached --check
          git commit -m "chore(control): bind ELYSIUM EDEN R5 to continuity manifest"
          git push origin HEAD:art/world-elysium-null-001
