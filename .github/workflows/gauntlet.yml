name: ORIGIN Real GLB Godot Canary
on:
  pull_request:
permissions:
  contents: read
jobs:
  real-glb-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ATRIO_URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/6e64cd59-f1f6-461f-850c-737d098f1723/revisions/00000006-origin-x100-wave2-lod-build-016/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260914T095402Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260914%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=be076e96f72c3b108b93ab9b20a75ba2963b789493ef9685c0db4e88fcbee6e8'
      ARCHIVE_URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/9bff5b6c-35a5-4db9-92de-4008a0fc3f4e/revisions/00000006-origin-archive-wave2-camera-fit-015/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260914T095415Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260914%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=29a0560a5b53158a8655a7304c4b1c1a87aee3beaa90d5278daf99dd0ba661cd'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch exact rev6 GLBs
        run: |
          mkdir -p /tmp/origin_import
          curl --fail --location --silent --show-error "$ATRIO_URL" -o /tmp/origin_import/origin_atrio_rev6.glb
          curl --fail --location --silent --show-error "$ARCHIVE_URL" -o /tmp/origin_import/origin_archive_rev6.glb
          test "$(stat -c%s /tmp/origin_import/origin_atrio_rev6.glb)" -eq 7039992
          test "$(stat -c%s /tmp/origin_import/origin_archive_rev6.glb)" -eq 5171380
          sha256sum /tmp/origin_import/*.glb
      - name: Acquire pinned Godot 4.7.2
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Build isolated import harness
        run: |
          cat > /tmp/origin_import/project.godot <<'EOF'
          [application]
          config/name="ORIGIN Real GLB Import Canary"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp tests/origin_real_glb_validate.gd /tmp/origin_import/validate.gd
      - name: Import GLBs and run real native gate
        run: |
          GODOT=.tools/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --editor --path /tmp/origin_import --quit-after 45
          "$GODOT" --headless --path /tmp/origin_import --script res://validate.gd
