name: ORIGIN Real GLB Godot Canary
on:
  pull_request:
permissions:
  contents: read
jobs:
  real-glb-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ATRIO_URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/6e64cd59-f1f6-461f-850c-737d098f1723/revisions/00000006-origin-x100-wave2-lod-build-016/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260914T094932Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260914%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=b8205fdb8f61ce6ad0961ff5dfadd7d74c37bfcf5b48a1788b6f1d39615ea351'
      ARCHIVE_URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/9bff5b6c-35a5-4db9-92de-4008a0fc3f4e/revisions/00000006-origin-archive-wave2-camera-fit-015/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260914T094941Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260914%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=e1930852a2998a671cf68fe1035cacaec9d7e7b7c78170cf36e18f24e15edb2f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch exact rev6 GLBs
        run: |
          mkdir -p /tmp/origin_import
          curl --fail --location --silent --show-error "$ATRIO_URL" -o /tmp/origin_import/origin_atrio_rev6.glb
          curl --fail --location --silent --show-error "$ARCHIVE_URL" -o /tmp/origin_import/origin_archive_rev6.glb
          test "$(stat -c%s /tmp/origin_import/origin_atrio_rev6.glb)" -eq 7039992
          test "$(stat -c%s /tmp/origin_import/origin_archive_rev6.glb)" -eq 5171380
          sha256sum /tmp/origin_import/*.glb
      - name: Acquire pinned Godot 4.7.2
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Build isolated import harness
        run: |
          cat > /tmp/origin_import/project.godot <<'EOF'
          [application]
          config/name="ORIGIN Real GLB Import Canary"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cat > /tmp/origin_import/validate.gd <<'EOF'
          extends SceneTree

          var failures: Array[String] = []
          var report := {}

          func _initialize() -> void:
              call_deferred("_run")

          func _walk(node: Node, out: Array[Node]) -> void:
              out.append(node)
              for child in node.get_children():
                  _walk(child, out)

          func _inspect_scene(path: String, label: String) -> Dictionary:
              var packed = ResourceLoader.load(path, "PackedScene")
              if packed == null or not (packed is PackedScene):
                  failures.append(label + ": PackedScene load failed")
                  return {"loaded": false}
              var instance = packed.instantiate()
              if instance == null:
                  failures.append(label + ": instantiate failed")
                  return {"loaded": false}
              get_root().add_child(instance)
              var nodes: Array[Node] = []
              _walk(instance, nodes)
              var mesh_count := 0
              var material_slots := 0
              var names: Array[String] = []
              var collision_meshes: Array[Node] = []
              var lod1 := 0
              var lod2 := 0
              for node in nodes:
                  var n := String(node.name)
                  names.append(n)
                  if n.begins_with("LOD1__"):
                      lod1 += 1
                  if n.begins_with("LOD2__"):
                      lod2 += 1
                  if node is MeshInstance3D and node.mesh != null:
                      mesh_count += 1
                      for surface in range(node.mesh.get_surface_count()):
                          if node.mesh.surface_get_material(surface) != null:
                              material_slots += 1
                      if n.begins_with("COL_"):
                          collision_meshes.append(node)
              var service_count := 0
              var culture_count := 0
              var arc_count := 0
              var assemblies := 0
              var expected_assemblies = {
                  "ORG_ARC_ASM_WITNESS_GALLERY_A": true,
                  "ORG_ARC_ASM_VAULT_JUNCTION_A": true,
                  "ORG_ARC_ASM_MEMORY_NAVE_A": true,
                  "ORG_ARC_ASM_SCAR_THRESHOLD_A": true,
              }
              for n in names:
                  if n.begins_with("ORG_ATR_SVC_"):
                      service_count += 1
                  if n.begins_with("ORG_CULT_"):
                      culture_count += 1
                  if n.begins_with("ORG_ARC_"):
                      arc_count += 1
                  if expected_assemblies.has(n):
                      assemblies += 1
              var result = {
                  "loaded": true,
                  "node_count": nodes.size(),
                  "mesh_count": mesh_count,
                  "material_slots": material_slots,
                  "collision_mesh_count": collision_meshes.size(),
                  "lod1_nodes": lod1,
                  "lod2_nodes": lod2,
                  "service_named_nodes": service_count,
                  "culture_named_nodes": culture_count,
                  "archive_named_nodes": arc_count,
                  "assembly_ids_found": assemblies,
                  "root": instance,
                  "collision_meshes": collision_meshes,
              }
              return result

          func _build_static_collision(world: Node3D, mesh_nodes: Array[Node]) -> int:
              var count := 0
              for node in mesh_nodes:
                  if not (node is MeshInstance3D) or node.mesh == null:
                      continue
                  var shape = node.mesh.create_trimesh_shape()
                  if shape == null:
                      continue
                  var body := StaticBody3D.new()
                  var collision := CollisionShape3D.new()
                  collision.shape = shape
                  body.add_child(collision)
                  world.add_child(body)
                  body.global_transform = node.global_transform
                  count += 1
              return count

          func _ray_support(world: Node3D, xz: Vector2) -> Dictionary:
              var space = world.get_world_3d().direct_space_state
              var query = PhysicsRayQueryParameters3D.create(Vector3(xz.x, 20.0, xz.y), Vector3(xz.x, -10.0, xz.y))
              query.collide_with_bodies = true
              query.collide_with_areas = false
              return space.intersect_ray(query)

          func _settle_character(world: Node3D, position: Vector3) -> Dictionary:
              var body := CharacterBody3D.new()
              var collision := CollisionShape3D.new()
              var capsule := CapsuleShape3D.new()
              capsule.radius = 0.38
              capsule.height = 1.85
              collision.shape = capsule
              body.add_child(collision)
              world.add_child(body)
              body.global_position = position
              var floor_frames := 0
              for i in range(180):
                  if not body.is_on_floor():
                      body.velocity.y -= 18.0 / 60.0
                  else:
                      body.velocity.y = -0.05
                      floor_frames += 1
                  body.move_and_slide()
                  await physics_frame
              var result = {"on_floor": body.is_on_floor(), "floor_frames": floor_frames, "position": [body.global_position.x, body.global_position.y, body.global_position.z]}
              body.queue_free()
              await physics_frame
              return result

          func _radial_traverse(world: Node3D, angle: float) -> Dictionary:
              var direction := Vector3(cos(angle), 0.0, sin(angle)).normalized()
              var start := direction * 13.0 + Vector3(0.0, 10.0, 0.0)
              var body := CharacterBody3D.new()
              var collision := CollisionShape3D.new()
              var capsule := CapsuleShape3D.new()
              capsule.radius = 0.38
              capsule.height = 1.85
              collision.shape = capsule
              body.add_child(collision)
              world.add_child(body)
              body.global_position = start
              for i in range(180):
                  body.velocity.y -= 18.0 / 60.0
                  body.move_and_slide()
                  await physics_frame
                  if body.is_on_floor():
                      break
              var floor_frames := 0
              var min_y := body.global_position.y
              for i in range(360):
                  body.velocity.x = direction.x * 4.0
                  body.velocity.z = direction.z * 4.0
                  if body.is_on_floor():
                      body.velocity.y = -0.05
                      floor_frames += 1
                  else:
                      body.velocity.y -= 18.0 / 60.0
                  body.move_and_slide()
                  min_y = min(min_y, body.global_position.y)
                  await physics_frame
              var radial := Vector2(body.global_position.x, body.global_position.z).length()
              var result = {"final_radius": radial, "final_y": body.global_position.y, "min_y": min_y, "floor_frames": floor_frames}
              body.queue_free()
              await physics_frame
              return result

          func _run() -> void:
              var world := Node3D.new()
              world.name = "ORIGIN_IMPORT_WORLD"
              get_root().add_child(world)

              var atrio = _inspect_scene("res://origin_atrio_rev6.glb", "atrio")
              var archive = _inspect_scene("res://origin_archive_rev6.glb", "archive")
              if not atrio.get("loaded", false) or not archive.get("loaded", false):
                  print("ORIGIN_REAL_IMPORT_RESULT=" + JSON.stringify({"failures": failures, "atrio": atrio, "archive": archive}))
                  quit(2)
                  return

              world.add_child(atrio["root"])
              world.add_child(archive["root"])

              if int(atrio["mesh_count"]) < 300:
                  failures.append("atrio mesh count unexpectedly low")
              if int(atrio["lod1_nodes"]) < 140 or int(atrio["lod2_nodes"]) < 140:
                  failures.append("atrio LOD nodes missing after import")
              if int(atrio["service_named_nodes"]) < 19 or int(atrio["culture_named_nodes"]) < 17:
                  failures.append("atrio stable family naming lost")
              if int(archive["mesh_count"]) < 500:
                  failures.append("archive mesh count unexpectedly low")
              if int(archive["lod1_nodes"]) < 90 or int(archive["lod2_nodes"]) < 90:
                  failures.append("archive LOD nodes missing after import")
              if int(archive["assembly_ids_found"]) != 4:
                  failures.append("archive assembly IDs missing after import")

              var static_count := _build_static_collision(world, atrio["collision_meshes"])
              await physics_frame
              await physics_frame

              var best_angle := 0.0
              var best_support := -1
              var support_samples := 0
              for deg in range(0, 360, 15):
                  var angle := deg_to_rad(float(deg))
                  var score := 0
                  for r in range(13, 36, 2):
                      var p := Vector2(cos(angle) * float(r), sin(angle) * float(r))
                      if not _ray_support(world, p).is_empty():
                          score += 1
                  if score > best_support:
                      best_support = score
                      best_angle = angle
                      support_samples = 12

              var direction := Vector3(cos(best_angle), 0.0, sin(best_angle))
              var inner_land = await _settle_character(world, direction * 13.0 + Vector3(0.0, 10.0, 0.0))
              var outer_land = await _settle_character(world, direction * 35.0 + Vector3(0.0, 10.0, 0.0))
              var traverse = await _radial_traverse(world, best_angle)

              var physics_pass := static_count >= 19 and best_support >= 8 and inner_land["on_floor"] and outer_land["on_floor"] and float(traverse["final_radius"]) >= 30.0 and float(traverse["min_y"]) > -5.0
              if not physics_pass:
                  failures.append("real imported collision / CharacterBody traversal gate failed")

              var compact_atrio = atrio.duplicate()
              compact_atrio.erase("root")
              compact_atrio.erase("collision_meshes")
              var compact_archive = archive.duplicate()
              compact_archive.erase("root")
              compact_archive.erase("collision_meshes")
              report = {
                  "godot": Engine.get_version_info(),
                  "atrio": compact_atrio,
                  "archive": compact_archive,
                  "static_collision_meshes_built": static_count,
                  "best_radial_support_hits": best_support,
                  "best_radial_support_samples": support_samples,
                  "best_angle_degrees": rad_to_deg(best_angle),
                  "inner_character_landing": inner_land,
                  "outer_character_landing": outer_land,
                  "radial_character_traversal": traverse,
                  "physics_pass": physics_pass,
                  "failures": failures,
              }
              print("ORIGIN_REAL_IMPORT_RESULT=" + JSON.stringify(report))
              quit(0 if failures.is_empty() else 2)
          EOF
      - name: Import GLBs and run real native gate
        run: |
          GODOT=.tools/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --editor --path /tmp/origin_import --quit-after 45
          "$GODOT" --headless --path /tmp/origin_import --script res://validate.gd
