name: ORIGIN Wave04 Manifest Refresh
on:
  pull_request:
permissions:
  contents: write
jobs:
  manifest-refresh-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Refresh exact producer manifest
        run: |
          git show "7947ebd63e55cf5d022ddd9e7b7cc834be50a1d6:.github/workflows/gauntlet.yml" > .github/workflows/gauntlet.yml
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- MANIFEST.json; then
            echo "Manifest already exact"
            exit 0
          fi
          git add MANIFEST.json
          git commit -m "chore(origin): materialize Wave04 manifest [skip ci]"
          git push origin HEAD:integration/origin-wave04-manifest-refresh-004
