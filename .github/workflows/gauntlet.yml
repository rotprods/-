name: EXOVANT Gauntlet
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refresh producer projection in runner
        run: |
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          cp MANIFEST.json evidence/vanta-refreshed-manifest.json
      - name: Recover exact Vanta revision 9 sources
        env:
          VANTA_BLEND_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/c82188b1-afdc-43f2-828a-5f0e98291f83/revisions/00000009-vanta-rev9-godot-collision-contract-001/scene.blend?X-Amz-Expires=900&X-Amz-Date=20260912T213430Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260912%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=53eca79b2ed73edcc7fb3a05b395ca44b344d0ee58e71e1cdd530af3e29cd1ad"
          VANTA_GLB_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/c82188b1-afdc-43f2-828a-5f0e98291f83/revisions/00000009-vanta-rev9-godot-collision-contract-001/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260912T213435Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260912%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=54d72199530f3350f7db853bd84b5226181671a58df6d42948113a953dcb813d"
        run: |
          set -euo pipefail
          mkdir -p .tools/vanta-qual assets evidence
          curl -fL --retry 2 --retry-delay 2 --max-time 120 "$VANTA_BLEND_URL" -o .tools/vanta-qual/vanta_rev9.blend
          curl -fL --retry 2 --retry-delay 2 --max-time 120 "$VANTA_GLB_URL" -o assets/vanta_rev9.glb
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          blend=pathlib.Path('.tools/vanta-qual/vanta_rev9.blend')
          glb=pathlib.Path('assets/vanta_rev9.glb')
          assert blend.stat().st_size == 8178521, blend.stat().st_size
          assert glb.stat().st_size == 5993560, glb.stat().st_size
          raw=glb.read_bytes()
          magic, version, declared=struct.unpack_from('<4sII', raw, 0)
          assert magic == b'glTF' and version == 2 and declared == len(raw)
          chunk_len, chunk_type=struct.unpack_from('<II', raw, 12)
          assert chunk_type == 0x4E4F534A
          doc=json.loads(raw[20:20+chunk_len].decode('utf-8').rstrip(' \t\r\n\x00'))
          externals=[x.get('uri') for x in doc.get('buffers', []) + doc.get('images', []) if x.get('uri')]
          names=[n.get('name','') for n in doc.get('nodes', [])]
          suffix_nodes=[n for n in names if n.lower().endswith('_colonly')]
          assert len(suffix_nodes) == 20, len(suffix_nodes)
          assert not externals, externals
          receipt={
            'project_id':'c82188b1-afdc-43f2-828a-5f0e98291f83','revision':9,
            'blend_size':blend.stat().st_size,'glb_size':glb.stat().st_size,
            'blend_sha256':hashlib.sha256(blend.read_bytes()).hexdigest(),
            'glb_sha256':hashlib.sha256(raw).hexdigest(),
            'glb_meshes':len(doc.get('meshes',[])),'glb_nodes':len(doc.get('nodes',[])),
            'glb_materials':len(doc.get('materials',[])),'glb_images':len(doc.get('images',[])),
            'collision_suffix_nodes':suffix_nodes,'external_resources':externals,
            'transport_structure_passed':True}
          pathlib.Path('evidence/vanta-rev9-recovery.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Acquire pinned Godot archive
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Import and physics-qualify Vanta revision 9
        run: |
          set -euo pipefail
          cat > /tmp/vanta_rev9_qual.gd <<'GD'
          extends SceneTree

          var mesh_instances := 0
          var mesh_surfaces := 0
          var bound_material_surfaces := 0
          var static_bodies := 0
          var collision_shapes := 0
          var seen := {}
          var body_names := []
          var required_visual := [
              "VAN_CRANE_BASE", "VAN_ANCHOR_BASE", "VAN_RIB_PILLAR_-1",
              "VAN_SHELTER_BODY", "VAN_MOD_FLOOR_4M_A_DECK",
              "VAN_MOD_WALL_SOLID_4M_A_PANEL", "VAN_MOD_STAIR_4M_A_STEP_00"
          ]

          func walk(node: Node) -> void:
              seen[str(node.name)] = node
              if node is MeshInstance3D:
                  mesh_instances += 1
                  if node.mesh:
                      mesh_surfaces += node.mesh.get_surface_count()
                      for s in range(node.mesh.get_surface_count()):
                          if node.get_active_material(s) != null:
                              bound_material_surfaces += 1
              if node is StaticBody3D:
                  static_bodies += 1
                  body_names.append(str(node.name))
              if node is CollisionShape3D and node.shape != null:
                  collision_shapes += 1
              for child in node.get_children():
                  walk(child)

          func _initialize() -> void:
              call_deferred("run_qualification")

          func run_qualification() -> void:
              var packed = load("res://assets/vanta_rev9.glb")
              if packed == null or not (packed is PackedScene):
                  push_error("VANTA_REV9_IMPORT_NOT_PACKED_SCENE")
                  quit(30)
                  return
              var scene_root = packed.instantiate()
              get_root().add_child(scene_root)
              walk(scene_root)
              var missing := []
              for n in required_visual:
                  if not seen.has(n):
                      missing.append(n)
              await physics_frame
              await physics_frame
              var deck = seen.get("VAN_MOD_FLOOR_4M_A_DECK") as Node3D
              var ray_hit := {}
              if deck != null:
                  var p := deck.global_position
                  var query := PhysicsRayQueryParameters3D.create(p + Vector3(0, 10, 0), p - Vector3(0, 10, 0))
                  ray_hit = deck.get_world_3d().direct_space_state.intersect_ray(query)
              var passed := missing.is_empty() and static_bodies >= 20 and collision_shapes >= 20 and not ray_hit.is_empty()
              var receipt := {
                  "passed": passed,
                  "engine": Engine.get_version_info().get("string", "unknown"),
                  "artifact_sha256": OS.get_environment("VANTA_GLB_SHA256"),
                  "mesh_instances": mesh_instances,
                  "mesh_surfaces": mesh_surfaces,
                  "bound_material_surfaces": bound_material_surfaces,
                  "static_bodies": static_bodies,
                  "collision_shapes": collision_shapes,
                  "collision_body_names": body_names,
                  "missing_required_visual_names": missing,
                  "raycast_floor_hit": not ray_hit.is_empty(),
                  "raycast_collider": str(ray_hit.get("collider", "")),
                  "qualification_scope": "Godot 4.7.2 native import + generated static collision + one floor raycast. Not visual equivalence, gameplay traversal or target-hardware performance."
              }
              var f=FileAccess.open("res://evidence/vanta-rev9-native-receipt.json",FileAccess.WRITE)
              f.store_string(JSON.stringify(receipt,"  ")+"\n")
              f.close()
              print(JSON.stringify(receipt))
              scene_root.queue_free()
              quit(0 if passed else 31)
          GD
          export VANTA_GLB_SHA256="$(python3 -c 'import json; print(json.load(open("evidence/vanta-rev9-recovery.json"))["glb_sha256"])')"
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit-after 120 2>&1 | tee evidence/vanta-rev9-editor-import.log
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script /tmp/vanta_rev9_qual.gd 2>&1 | tee evidence/vanta-rev9-native-import.log
      - name: Preserve Vanta qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vanta-rev9-native-${{ github.sha }}
          path: evidence/
          retention-days: 30
