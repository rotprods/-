name: EXOVANT Vanta Rev10 Material Traversal Probe
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: vanta-rev10-material-traversal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Recover exact Vanta revision 10 GLB
        env:
          VANTA_GLB_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/c82188b1-afdc-43f2-828a-5f0e98291f83/revisions/00000010-vanta-rev10-texture-payload-repair-001/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260912T222007Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260912%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=3ae1712bcb261941ac72fc1acc9e8ce02ca637f0ab90d06ed0bfc1c82d595a44"
        run: |
          set -euo pipefail
          mkdir -p assets evidence
          curl -fL --retry 2 --retry-delay 2 --max-time 120 "$VANTA_GLB_URL" -o assets/vanta_rev10.glb
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          p=pathlib.Path('assets/vanta_rev10.glb')
          raw=p.read_bytes()
          assert len(raw)==9228876, len(raw)
          digest=hashlib.sha256(raw).hexdigest()
          magic,version,declared=struct.unpack_from('<4sII',raw,0)
          assert magic==b'glTF' and version==2 and declared==len(raw)
          jlen,jtype=struct.unpack_from('<II',raw,12)
          assert jtype==0x4E4F534A
          doc=json.loads(raw[20:20+jlen].decode('utf-8').rstrip(' \t\r\n\x00'))
          externals=[x.get('uri') for x in doc.get('buffers',[])+doc.get('images',[]) if x.get('uri')]
          assert not externals, externals
          samplers=doc.get('samplers',[])
          assert len(samplers)==1, len(samplers)
          suffix=[n.get('name','') for n in doc.get('nodes',[]) if n.get('name','').lower().endswith('_colonly')]
          assert len(suffix)==20, len(suffix)
          rec={'revision':10,'glb_size':len(raw),'glb_sha256':digest,'meshes':len(doc.get('meshes',[])),'nodes':len(doc.get('nodes',[])),'materials':len(doc.get('materials',[])),'images':len(doc.get('images',[])),'samplers':samplers,'collision_suffix_count':len(suffix),'external_resources':externals}
          pathlib.Path('evidence/vanta_rev10_recovery.json').write_text(json.dumps(rec,indent=2)+'\n')
          pathlib.Path('/tmp/vanta_rev10_sha').write_text(digest)
          print(json.dumps(rec))
          PY
      - name: Acquire pinned Godot
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Import revision 10
        run: .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit-after 120
      - name: Material payload readback, viewport capture and CharacterBody traversal
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          fi
          export VANTA_REV10_SHA="$(cat /tmp/vanta_rev10_sha)"
          cat > /tmp/vanta_rev10_probe.gd <<'GD'
          extends SceneTree

          var material_rows: Array = []
          var material_seen: Dictionary = {}

          func find_named(node: Node, target: String) -> Node:
              if str(node.name) == target:
                  return node
              for child_variant in node.get_children():
                  var child: Node = child_variant as Node
                  var found: Node = find_named(child, target)
                  if found != null:
                      return found
              return null

          func sample_texture(tex: Texture2D) -> Dictionary:
              if tex == null:
                  return {"available":false}
              var img: Image = tex.get_image()
              if img == null or img.is_empty():
                  return {"available":false}
              var w: int = img.get_width()
              var h: int = img.get_height()
              var sum := Vector3.ZERO
              var mn := Vector3(999.0,999.0,999.0)
              var mx := Vector3.ZERO
              var count: int = 0
              for gy in range(8):
                  for gx in range(8):
                      var x: int = int(round(float(gx) * float(max(0,w-1)) / 7.0))
                      var y: int = int(round(float(gy) * float(max(0,h-1)) / 7.0))
                      var c: Color = img.get_pixel(x,y)
                      var v := Vector3(c.r,c.g,c.b)
                      sum += v
                      mn = Vector3(min(mn.x,v.x),min(mn.y,v.y),min(mn.z,v.z))
                      mx = Vector3(max(mx.x,v.x),max(mx.y,v.y),max(mx.z,v.z))
                      count += 1
              var avg: Vector3 = sum / float(max(1,count))
              return {"available":true,"width":w,"height":h,"avg":[avg.x,avg.y,avg.z],"min":[mn.x,mn.y,mn.z],"max":[mx.x,mx.y,mx.z]}

          func collect_materials(node: Node) -> void:
              if node is MeshInstance3D:
                  var mi: MeshInstance3D = node as MeshInstance3D
                  if mi.mesh != null:
                      for s in range(mi.mesh.get_surface_count()):
                          var mat: Material = mi.get_active_material(s)
                          if mat is BaseMaterial3D:
                              var bm: BaseMaterial3D = mat as BaseMaterial3D
                              var key: String = str(bm.get_instance_id())
                              if not material_seen.has(key):
                                  material_seen[key] = true
                                  var rn: String = str(bm.resource_name)
                                  if rn.begins_with("M_VAN_CP4_") or rn.begins_with("M_VAN_CP5_"):
                                      var albedo_tex: Texture2D = bm.get("albedo_texture") as Texture2D
                                      material_rows.append({
                                          "name":rn,
                                          "class":bm.get_class(),
                                          "texture_filter":int(bm.texture_filter),
                                          "albedo_texture":albedo_tex != null,
                                          "albedo_sample":sample_texture(albedo_tex),
                                          "orm_texture":bm.get("orm_texture") != null,
                                          "metallic_texture":bm.get("metallic_texture") != null,
                                          "roughness_texture":bm.get("roughness_texture") != null,
                                          "normal_texture":bm.get("normal_texture") != null,
                                          "metallic_channel":int(bm.get("metallic_texture_channel")) if bm.get("metallic_texture_channel") != null else -1,
                                          "roughness_channel":int(bm.get("roughness_texture_channel")) if bm.get("roughness_texture_channel") != null else -1,
                                          "ao_texture":bm.get("ao_texture") != null,
                                          "ao_channel":int(bm.get("ao_texture_channel")) if bm.get("ao_texture_channel") != null else -1,
                                          "normal_enabled":bool(bm.get("normal_enabled")) if bm.get("normal_enabled") != null else false,
                                          "transparency":int(bm.get("transparency")) if bm.get("transparency") != null else -1
                                      })
              for child_variant in node.get_children():
                  collect_materials(child_variant as Node)

          func first_collision_shape(node: Node) -> CollisionShape3D:
              if node is CollisionShape3D:
                  var here := node as CollisionShape3D
                  if here.shape != null:
                      return here
              for child_variant in node.get_children():
                  var found: CollisionShape3D = first_collision_shape(child_variant as Node)
                  if found != null:
                      return found
              return null

          func points_bounds(points: PackedVector3Array, xf: Transform3D) -> AABB:
              if points.is_empty():
                  return AABB()
              var p0: Vector3 = xf * points[0]
              var mn: Vector3 = p0
              var mx: Vector3 = p0
              for p_local in points:
                  var p: Vector3 = xf * p_local
                  mn = Vector3(min(mn.x,p.x),min(mn.y,p.y),min(mn.z,p.z))
                  mx = Vector3(max(mx.x,p.x),max(mx.y,p.y),max(mx.z,p.z))
              return AABB(mn,mx-mn)

          func shape_world_bounds(cs: CollisionShape3D) -> AABB:
              if cs.shape is ConcavePolygonShape3D:
                  return points_bounds((cs.shape as ConcavePolygonShape3D).get_faces(),cs.global_transform)
              if cs.shape is ConvexPolygonShape3D:
                  return points_bounds((cs.shape as ConvexPolygonShape3D).points,cs.global_transform)
              if cs.shape is BoxShape3D:
                  var h: Vector3 = (cs.shape as BoxShape3D).size * 0.5
                  var pts := PackedVector3Array([Vector3(-h.x,-h.y,-h.z),Vector3(h.x,-h.y,-h.z),Vector3(-h.x,h.y,-h.z),Vector3(h.x,h.y,-h.z),Vector3(-h.x,-h.y,h.z),Vector3(h.x,-h.y,h.z),Vector3(-h.x,h.y,h.z),Vector3(h.x,h.y,h.z)])
                  return points_bounds(pts,cs.global_transform)
              return AABB()

          func _initialize() -> void:
              call_deferred("run_probe")

          func run_probe() -> void:
              var packed: Resource = load("res://assets/vanta_rev10.glb")
              if packed == null or not (packed is PackedScene):
                  push_error("VANTA_REV10_IMPORT_FAIL")
                  quit(50)
                  return
              var scene_root: Node = (packed as PackedScene).instantiate()
              get_root().add_child(scene_root)
              await process_frame
              await process_frame
              collect_materials(scene_root)

              var cam: Camera3D = find_named(scene_root,"CAM_CP5_NEUTRAL_BOARD") as Camera3D
              if cam != null:
                  cam.current = true
              get_root().size = Vector2i(640,480)
              for _i in range(8):
                  await process_frame
              var capture_ok: bool = false
              if cam != null:
                  var img: Image = get_root().get_texture().get_image()
                  capture_ok = img != null and not img.is_empty() and img.save_png("res://evidence/vanta_rev10_godot_cp5_neutral.png") == OK

              var floor_body: StaticBody3D = find_named(scene_root,"COL_VAN_CP4_TEST_YARD_FLOOR") as StaticBody3D
              var floor_cs: CollisionShape3D = first_collision_shape(floor_body) if floor_body != null else null
              var bounds: AABB = shape_world_bounds(floor_cs) if floor_cs != null else AABB()
              var traversal_ok: bool = false
              var reached: bool = false
              var floor_frames: int = 0
              var travel_ratio: float = 0.0
              var start := Vector3.ZERO
              var target := Vector3.ZERO
              var final_pos := Vector3.ZERO
              if floor_body != null and floor_cs != null and bounds.size.length() > 0.0:
                  var axis: Vector3 = Vector3.RIGHT if bounds.size.x >= bounds.size.z else Vector3.BACK
                  var span: float = bounds.size.x if bounds.size.x >= bounds.size.z else bounds.size.z
                  var center: Vector3 = bounds.position + bounds.size*0.5
                  start = center - axis*max(0.0,span*0.5-0.9)
                  target = center + axis*max(0.0,span*0.5-0.9)
                  start.y = bounds.end.y + 1.15
                  target.y = start.y
                  var player := CharacterBody3D.new()
                  player.up_direction = Vector3.UP
                  player.floor_snap_length = 0.35
                  player.floor_max_angle = deg_to_rad(50.0)
                  var pcs := CollisionShape3D.new()
                  var cap := CapsuleShape3D.new()
                  cap.radius=0.35
                  cap.height=1.8
                  pcs.shape=cap
                  player.add_child(pcs)
                  get_root().add_child(player)
                  player.global_position=start
                  for _i in range(90):
                      player.velocity.x=0.0; player.velocity.z=0.0
                      if not player.is_on_floor(): player.velocity.y -= 9.8/60.0
                      else: player.velocity.y=-0.05; floor_frames += 1
                      player.move_and_slide()
                      await physics_frame
                  var settled: Vector3 = player.global_position
                  var planar_target := Vector3(target.x,settled.y,target.z)
                  var intended := Vector3(planar_target.x-settled.x,0,planar_target.z-settled.z)
                  var intended_len: float = max(0.001,intended.length())
                  var dir: Vector3 = intended.normalized()
                  for _i in range(360):
                      var rem := Vector3(planar_target.x-player.global_position.x,0,planar_target.z-player.global_position.z)
                      if rem.length() < 0.35:
                          reached=true
                          break
                      player.velocity.x=dir.x*2.4; player.velocity.z=dir.z*2.4
                      if not player.is_on_floor(): player.velocity.y -= 9.8/60.0
                      else: player.velocity.y=-0.05; floor_frames += 1
                      player.move_and_slide()
                      if player.global_position.y < bounds.position.y-4.0: break
                      await physics_frame
                  final_pos=player.global_position
                  travel_ratio=Vector3(final_pos.x-settled.x,0,final_pos.z-settled.z).dot(dir)/intended_len
                  traversal_ok=reached and floor_frames>180 and travel_ratio>0.95
                  player.queue_free()

              material_rows.sort_custom(func(a: Variant,b: Variant)->bool: return str(a["name"])<str(b["name"]))
              var by_name: Dictionary = {}
              for row_variant in material_rows:
                  var row: Dictionary = row_variant as Dictionary
                  by_name[str(row["name"])]=row
              var required: Array[String] = ["M_VAN_CP4_STEEL","M_VAN_CP4_RUST","M_VAN_CP4_UNION_YELLOW","M_VAN_CP5_TRIM_A","M_VAN_CP5_DECAL_A"]
              var missing: Array[String] = []
              for n in required:
                  if not by_name.has(n): missing.append(n)
              var steel: Dictionary = by_name.get("M_VAN_CP4_STEEL",{}) as Dictionary
              var rust: Dictionary = by_name.get("M_VAN_CP4_RUST",{}) as Dictionary
              var yellow: Dictionary = by_name.get("M_VAN_CP4_UNION_YELLOW",{}) as Dictionary
              var steel_avg: Array = (steel.get("albedo_sample",{}) as Dictionary).get("avg",[]) as Array
              var rust_avg: Array = (rust.get("albedo_sample",{}) as Dictionary).get("avg",[]) as Array
              var yellow_avg: Array = (yellow.get("albedo_sample",{}) as Dictionary).get("avg",[]) as Array
              var color_roles_ok: bool = steel_avg.size()==3 and rust_avg.size()==3 and yellow_avg.size()==3
              if color_roles_ok:
                  color_roles_ok = float(yellow_avg[0]) > float(steel_avg[0])*2.0 and float(rust_avg[0]) > float(rust_avg[1])*1.7 and float(steel_avg[2]) >= float(steel_avg[0])

              var receipt: Dictionary = {
                  "schema":"exovant.vanta.rev10-material-traversal.v1",
                  "engine":Engine.get_version_info().get("string","unknown"),
                  "artifact_sha256":OS.get_environment("VANTA_REV10_SHA"),
                  "capture_ok":capture_ok,
                  "camera_found":cam!=null,
                  "material_rows":material_rows,
                  "missing_required_materials":missing,
                  "gross_color_roles_pass":color_roles_ok,
                  "floor_body_found":floor_body!=null,
                  "floor_shape_found":floor_cs!=null,
                  "traversal":{"passed":traversal_ok,"reached_target":reached,"floor_frames":floor_frames,"travel_ratio":travel_ratio,"start":[start.x,start.y,start.z],"target":[target.x,target.y,target.z],"final":[final_pos.x,final_pos.y,final_pos.z]},
                  "scope":"Godot 4.7.2 CPU Mesa/gl_compatibility import/readback/capture plus CharacterBody3D traversal. This validates payload transport and gross material roles, not final photometric equivalence or target-GPU performance."
              }
              var f: FileAccess = FileAccess.open("res://evidence/vanta_rev10_material_traversal.json",FileAccess.WRITE)
              f.store_string(JSON.stringify(receipt,"  ")+"\n"); f.close()
              print(JSON.stringify(receipt))
              scene_root.queue_free()
              quit(0 if traversal_ok and capture_ok and color_roles_ok and missing.is_empty() else 51)
          GD
          xvfb-run -a -s "-screen 0 640x480x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            .tools/Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --audio-driver Dummy --script /tmp/vanta_rev10_probe.gd \
            2>&1 | tee evidence/vanta_rev10_material_traversal.log
      - name: Measure revision 10 Godot import cache footprint
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          rows=[]
          root=pathlib.Path('.godot/imported')
          if root.exists():
              for p in root.rglob('*'):
                  if p.is_file(): rows.append({'path':str(p),'bytes':p.stat().st_size})
          vanta=[x for x in rows if 'vanta_rev10' in x['path']]
          payload={'vanta_file_count':len(vanta),'vanta_total_bytes':sum(x['bytes'] for x in vanta),'largest':sorted(vanta,key=lambda x:x['bytes'],reverse=True)[:20]}
          pathlib.Path('evidence/vanta_rev10_godot_import_cache.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload))
          PY
      - name: Preserve revision 10 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vanta-rev10-material-traversal-${{ github.sha }}
          path: evidence/
          retention-days: 30