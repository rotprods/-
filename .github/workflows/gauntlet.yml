name: EXOVANT Gauntlet
on:
  # TEMPORARY COST QUARANTINE: explicit manual promotion only.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify committed evidence and continuity
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          # Integration scratch branches may add non-production harness files. Refresh only
          # inside the ephemeral runner workspace; this branch is explicitly NO MERGE.
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
      - name: Acquire pinned Godot archive
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Execute native scene gates from source
        run: python3 tests/run_gauntlet.py --godot .tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Execute ORIGIN Atrio surrogate traversal
        run: |
          set -o pipefail
          rm -f evidence/origin-atrio-surrogate.json evidence/origin-atrio-surrogate.log
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script integration/origin/test_origin_atrio_surrogate.gd 2>&1 | tee evidence/origin-atrio-surrogate.log
          test -f evidence/origin-atrio-surrogate.json
          python3 -c 'import json; d=json.load(open("evidence/origin-atrio-surrogate.json")); assert d["failed"] == 0 and d["real_glb_import"] is False and d["truth_state"] == "SURROGATE_TRAVERSAL_ONLY"'
      - name: Preserve this run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exovant-evidence-${{ github.sha }}
          path: |
            evidence/
            telemetry/
          retention-days: 30
