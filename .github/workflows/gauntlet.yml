name: EXOVANT Gauntlet
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify committed evidence and continuity
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          # Diagnostic-only refresh in runner. The resulting manifest is copied to evidence
          # so the producer can commit the exact deterministic projection afterwards.
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          cp MANIFEST.json evidence/vanta-refreshed-manifest.json
          echo '---VANTA_REFRESHED_MANIFEST_BEGIN---'
          cat MANIFEST.json
          echo '---VANTA_REFRESHED_MANIFEST_END---'
      - name: Recover exact Vanta revision 8 sources
        env:
          VANTA_BLEND_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/c82188b1-afdc-43f2-828a-5f0e98291f83/revisions/00000008-vanta-cp5-trim-decal-001/scene.blend?X-Amz-Expires=900&X-Amz-Date=20260912T212949Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260912%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=22344979bbb72511a081905f5f91598fe93ac1ad46019c8b45cebca134625acc"
          VANTA_GLB_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/c82188b1-afdc-43f2-828a-5f0e98291f83/revisions/00000008-vanta-cp5-trim-decal-001/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260912T212957Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260912%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=404e53b6e8214f12e860fef8f3aa63132092d2e59e7efad93dd01012539c6a55"
        run: |
          set -euo pipefail
          mkdir -p .tools/vanta-qual assets evidence
          curl -fL --retry 2 --retry-delay 2 --max-time 120 "$VANTA_BLEND_URL" -o .tools/vanta-qual/vanta_rev8.blend
          curl -fL --retry 2 --retry-delay 2 --max-time 120 "$VANTA_GLB_URL" -o assets/vanta_rev8.glb
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          blend = pathlib.Path('.tools/vanta-qual/vanta_rev8.blend')
          glb = pathlib.Path('assets/vanta_rev8.glb')
          assert blend.stat().st_size == 8168427, blend.stat().st_size
          assert glb.stat().st_size == 5990788, glb.stat().st_size
          raw = glb.read_bytes()
          magic, version, declared = struct.unpack_from('<4sII', raw, 0)
          assert magic == b'glTF' and version == 2 and declared == len(raw)
          chunk_len, chunk_type = struct.unpack_from('<II', raw, 12)
          assert chunk_type == 0x4E4F534A
          doc = json.loads(raw[20:20+chunk_len].decode('utf-8').rstrip(' \t\r\n\x00'))
          assert doc.get('meshes'), 'no meshes in Vanta GLB'
          externals = [x.get('uri') for x in doc.get('buffers', []) + doc.get('images', []) if x.get('uri')]
          assert not externals, externals
          receipt = {
              'project_id': 'c82188b1-afdc-43f2-828a-5f0e98291f83',
              'revision': 8,
              'blend_size': blend.stat().st_size,
              'glb_size': glb.stat().st_size,
              'blend_sha256': hashlib.sha256(blend.read_bytes()).hexdigest(),
              'glb_sha256': hashlib.sha256(raw).hexdigest(),
              'glb_meshes': len(doc.get('meshes', [])),
              'glb_nodes': len(doc.get('nodes', [])),
              'glb_materials': len(doc.get('materials', [])),
              'glb_images': len(doc.get('images', [])),
              'external_resources': externals,
              'transport_structure_passed': True,
          }
          pathlib.Path('evidence/vanta-rev8-recovery.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Acquire pinned Godot archive
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Execute native scene gates from source
        run: python3 tests/run_gauntlet.py --godot .tools/Godot_v4.7.2-stable_linux.x86_64
      - name: Qualify Vanta rev8 native import
        run: |
          set -euo pipefail
          cat > /tmp/vanta_asset_qual.gd <<'GD'
          extends SceneTree

          var mesh_count := 0
          var surface_count := 0
          var collision_nodes := 0
          var seen := {}
          var required := [
              "VAN_CRANE_BASE",
              "VAN_ANCHOR_BASE",
              "VAN_RIB_PILLAR_-1",
              "VAN_SHELTER_BODY",
              "VAN_MOD_FLOOR_4M_A_DECK",
              "VAN_MOD_WALL_SOLID_4M_A_PANEL",
              "VAN_MOD_STAIR_4M_A_STEP_00"
          ]

          func walk(node: Node) -> void:
              seen[str(node.name)] = true
              if node is MeshInstance3D:
                  mesh_count += 1
                  if node.mesh:
                      surface_count += node.mesh.get_surface_count()
              if node is CollisionObject3D:
                  collision_nodes += 1
              for child in node.get_children():
                  walk(child)

          func _init() -> void:
              var packed = load("res://assets/vanta_rev8.glb")
              if packed == null or not (packed is PackedScene):
                  push_error("VANTA_IMPORT_NOT_PACKED_SCENE")
                  quit(20)
                  return
              var root = packed.instantiate()
              walk(root)
              var missing := []
              for n in required:
                  if not seen.has(n):
                      missing.append(n)
              var receipt := {
                  "passed": mesh_count > 0 and missing.is_empty(),
                  "engine": Engine.get_version_info().get("string", "unknown"),
                  "artifact_sha256": OS.get_environment("VANTA_GLB_SHA256"),
                  "mesh_instances": mesh_count,
                  "mesh_surfaces": surface_count,
                  "collision_object_nodes": collision_nodes,
                  "required_names": required,
                  "missing_required_names": missing,
                  "note": "Native import/name/surface gate only; physical collision and visual/performance approval remain separate."
              }
              var f = FileAccess.open("res://evidence/vanta-native-receipt.json", FileAccess.WRITE)
              f.store_string(JSON.stringify(receipt, "  ") + "\n")
              f.close()
              print(JSON.stringify(receipt))
              root.free()
              quit(0 if receipt["passed"] else 21)
          GD
          export VANTA_GLB_SHA256="$(python3 -c 'import json; print(json.load(open("evidence/vanta-rev8-recovery.json"))["glb_sha256"])')"
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit-after 120
          .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script /tmp/vanta_asset_qual.gd 2>&1 | tee evidence/vanta-native-import.log
      - name: Preserve this run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exovant-evidence-${{ github.sha }}
          path: |
            evidence/
            telemetry/
          retention-days: 30
