name: EXOVANT Vanta Visual Traversal Probe
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: vanta-visual-traversal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Recover exact Vanta revision 9 GLB
        env:
          VANTA_GLB_URL: "https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/c82188b1-afdc-43f2-828a-5f0e98291f83/revisions/00000009-vanta-rev9-godot-collision-contract-001/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260912T220431Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260912%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=05d86cc6a9ec56e1f26768a8f38e4817cdf97f582121d90a949005f690207980"
        run: |
          set -euo pipefail
          mkdir -p assets evidence
          curl -fL --retry 2 --retry-delay 2 --max-time 120 "$VANTA_GLB_URL" -o assets/vanta_rev9.glb
          python3 - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('assets/vanta_rev9.glb')
          raw=p.read_bytes()
          assert len(raw)==5993560, len(raw)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='d4cb8154802e7713b9887328431bd27dfdbc6ba6bec07e790fd0b99befef3258', digest
          print('rev9 glb verified', digest)
          PY
      - name: Acquire pinned Godot
        run: python3 tools/bootstrap_godot.py --destination .tools
      - name: Import asset
        run: .tools/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit-after 120
      - name: Run material readback, viewport capture and CharacterBody traversal
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          fi
          cat > /tmp/vanta_visual_traversal.gd <<'GD'
          extends SceneTree

          var material_rows: Array = []
          var material_seen: Dictionary = {}

          func find_named(node: Node, target: String) -> Node:
              if str(node.name) == target:
                  return node
              for child in node.get_children():
                  var found := find_named(child, target)
                  if found != null:
                      return found
              return null

          func collect_materials(node: Node) -> void:
              if node is MeshInstance3D and node.mesh:
                  for s in range(node.mesh.get_surface_count()):
                      var mat := node.get_active_material(s)
                      if mat is BaseMaterial3D:
                          var key := str(mat.get_instance_id())
                          if not material_seen.has(key):
                              material_seen[key] = true
                              var rn := str(mat.resource_name)
                              if rn.begins_with("M_VAN_CP4_") or rn.begins_with("M_VAN_CP5_"):
                                  material_rows.append({
                                      "name": rn,
                                      "class": mat.get_class(),
                                      "texture_filter": int(mat.texture_filter),
                                      "albedo_texture": mat.albedo_texture != null,
                                      "orm_texture": mat.orm_texture != null,
                                      "metallic_texture": mat.metallic_texture != null,
                                      "roughness_texture": mat.roughness_texture != null,
                                      "normal_texture": mat.normal_texture != null,
                                      "metallic_channel": int(mat.metallic_texture_channel),
                                      "roughness_channel": int(mat.roughness_texture_channel),
                                      "ao_texture": mat.ao_texture != null,
                                      "ao_channel": int(mat.ao_texture_channel),
                                      "normal_enabled": bool(mat.normal_enabled),
                                      "transparency": int(mat.transparency)
                                  })
              for child in node.get_children():
                  collect_materials(child)

          func first_collision_shape(node: Node) -> CollisionShape3D:
              if node is CollisionShape3D and node.shape != null:
                  return node
              for child in node.get_children():
                  var found := first_collision_shape(child)
                  if found != null:
                      return found
              return null

          func shape_world_bounds(cs: CollisionShape3D) -> AABB:
              if cs.shape is ConcavePolygonShape3D:
                  var faces: PackedVector3Array = (cs.shape as ConcavePolygonShape3D).get_faces()
                  if faces.is_empty():
                      return AABB()
                  var p0: Vector3 = cs.global_transform * faces[0]
                  var mn := p0
                  var mx := p0
                  for p_local in faces:
                      var p: Vector3 = cs.global_transform * p_local
                      mn = Vector3(min(mn.x,p.x), min(mn.y,p.y), min(mn.z,p.z))
                      mx = Vector3(max(mx.x,p.x), max(mx.y,p.y), max(mx.z,p.z))
                  return AABB(mn, mx-mn)
              return AABB()

          func _initialize() -> void:
              call_deferred("run_probe")

          func run_probe() -> void:
              var packed: Resource = load("res://assets/vanta_rev9.glb")
              if packed == null or not (packed is PackedScene):
                  push_error("VANTA_PROBE_IMPORT_FAIL")
                  quit(40)
                  return
              var scene_root: Node = (packed as PackedScene).instantiate()
              get_root().add_child(scene_root)
              await process_frame
              await process_frame
              collect_materials(scene_root)

              var cam := find_named(scene_root, "CAM_CP5_NEUTRAL_BOARD") as Camera3D
              if cam != null:
                  cam.current = true
              get_root().size = Vector2i(640,480)
              for i in range(8):
                  await process_frame
              var image_path := "res://evidence/vanta_godot_cp5_neutral.png"
              var capture_ok := false
              if cam != null:
                  var img: Image = get_root().get_texture().get_image()
                  capture_ok = img != null and not img.is_empty() and img.save_png(image_path) == OK

              var floor_body := find_named(scene_root, "COL_VAN_CP4_TEST_YARD_FLOOR") as StaticBody3D
              var floor_cs: CollisionShape3D = first_collision_shape(floor_body) if floor_body != null else null
              var bounds := shape_world_bounds(floor_cs) if floor_cs != null else AABB()
              var traversal_ok := false
              var reached := false
              var floor_frames := 0
              var slide_collisions := 0
              var travel_ratio := 0.0
              var start := Vector3.ZERO
              var target := Vector3.ZERO
              var final_pos := Vector3.ZERO
              var axis := Vector3.ZERO

              if floor_body != null and floor_cs != null and bounds.size.length() > 0.0:
                  var use_x := bounds.size.x >= bounds.size.z
                  axis = Vector3.RIGHT if use_x else Vector3.BACK
                  var span := bounds.size.x if use_x else bounds.size.z
                  var center := bounds.position + bounds.size * 0.5
                  start = center - axis * max(0.0, span * 0.5 - 0.9)
                  target = center + axis * max(0.0, span * 0.5 - 0.9)
                  start.y = bounds.end.y + 1.15
                  target.y = start.y

                  var player := CharacterBody3D.new()
                  player.name = "VANTA_TRAVERSAL_PROBE"
                  player.up_direction = Vector3.UP
                  player.floor_snap_length = 0.35
                  player.floor_max_angle = deg_to_rad(50.0)
                  var pcs := CollisionShape3D.new()
                  var cap := CapsuleShape3D.new()
                  cap.radius = 0.35
                  cap.height = 1.8
                  pcs.shape = cap
                  player.add_child(pcs)
                  get_root().add_child(player)
                  player.global_position = start

                  for i in range(90):
                      player.velocity.x = 0.0
                      player.velocity.z = 0.0
                      if not player.is_on_floor():
                          player.velocity.y -= 9.8 / 60.0
                      else:
                          player.velocity.y = -0.05
                          floor_frames += 1
                      player.move_and_slide()
                      slide_collisions += player.get_slide_collision_count()
                      await physics_frame

                  var settled_start := player.global_position
                  var planar_target := Vector3(target.x, player.global_position.y, target.z)
                  var intended := Vector3(planar_target.x-settled_start.x, 0, planar_target.z-settled_start.z)
                  var intended_len := max(0.001, intended.length())
                  var dir := intended.normalized()
                  for i in range(360):
                      var rem := Vector3(planar_target.x-player.global_position.x, 0, planar_target.z-player.global_position.z)
                      if rem.length() < 0.35:
                          reached = true
                          break
                      player.velocity.x = dir.x * 2.4
                      player.velocity.z = dir.z * 2.4
                      if not player.is_on_floor():
                          player.velocity.y -= 9.8 / 60.0
                      else:
                          player.velocity.y = -0.05
                          floor_frames += 1
                      player.move_and_slide()
                      slide_collisions += player.get_slide_collision_count()
                      if player.global_position.y < bounds.position.y - 4.0:
                          break
                      await physics_frame
                  final_pos = player.global_position
                  var progressed := Vector3(final_pos.x-settled_start.x,0,final_pos.z-settled_start.z).dot(dir)
                  travel_ratio = progressed / intended_len
                  traversal_ok = reached and floor_frames > 180 and travel_ratio > 0.95
                  player.queue_free()

              material_rows.sort_custom(func(a,b): return str(a["name"]) < str(b["name"]))
              var required_mats := ["M_VAN_CP4_STEEL","M_VAN_CP4_RUST","M_VAN_CP4_UNION_YELLOW","M_VAN_CP5_TRIM_A","M_VAN_CP5_DECAL_A"]
              var seen_names := {}
              for row in material_rows:
                  seen_names[row["name"]] = true
              var missing_mats := []
              for n in required_mats:
                  if not seen_names.has(n): missing_mats.append(n)

              var receipt := {
                  "schema":"exovant.vanta.visual-traversal-probe.v1",
                  "engine":Engine.get_version_info().get("string","unknown"),
                  "artifact_sha256":"d4cb8154802e7713b9887328431bd27dfdbc6ba6bec07e790fd0b99befef3258",
                  "camera_found":cam != null,
                  "capture_ok":capture_ok,
                  "material_rows":material_rows,
                  "missing_required_materials":missing_mats,
                  "floor_body_found":floor_body != null,
                  "floor_shape_found":floor_cs != null,
                  "floor_bounds":{"position":[bounds.position.x,bounds.position.y,bounds.position.z],"size":[bounds.size.x,bounds.size.y,bounds.size.z]},
                  "traversal":{"passed":traversal_ok,"reached_target":reached,"floor_frames":floor_frames,"slide_collisions":slide_collisions,"travel_ratio":travel_ratio,"start":[start.x,start.y,start.z],"target":[target.x,target.y,target.z],"final":[final_pos.x,final_pos.y,final_pos.z]},
                  "scope":"CPU Mesa/gl_compatibility visual capture plus real CharacterBody3D traversal over the CP4 test-yard floor collider. This is not target-GPU performance qualification."
              }
              var f:=FileAccess.open("res://evidence/vanta_visual_traversal_probe.json",FileAccess.WRITE)
              f.store_string(JSON.stringify(receipt,"  ")+"\n")
              f.close()
              print(JSON.stringify(receipt))
              scene_root.queue_free()
              quit(0 if traversal_ok and capture_ok and missing_mats.is_empty() else 41)
          GD
          xvfb-run -a -s "-screen 0 640x480x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            .tools/Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --audio-driver Dummy --script /tmp/vanta_visual_traversal.gd \
            2>&1 | tee evidence/vanta_visual_traversal_probe.log
      - name: Measure Godot import cache footprint
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.godot/imported')
          rows=[]
          if root.exists():
              for p in root.rglob('*'):
                  if p.is_file(): rows.append({'path':str(p),'bytes':p.stat().st_size})
          payload={'file_count':len(rows),'total_bytes':sum(x['bytes'] for x in rows),'largest':sorted(rows,key=lambda x:x['bytes'],reverse=True)[:20]}
          pathlib.Path('evidence/vanta_godot_import_cache.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload))
          PY
      - name: Preserve Vanta probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vanta-visual-traversal-${{ github.sha }}
          path: evidence/
          retention-days: 30