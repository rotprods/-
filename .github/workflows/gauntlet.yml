name: EXOVANT Vanta Manifest Repair
on:
  pull_request:
permissions:
  contents: write
concurrency:
  group: vanta-manifest-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Refresh manifest using exact canonical gauntlet bytes
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > .github/workflows/gauntlet.yml
          test "$(sha256sum .github/workflows/gauntlet.yml | cut -d' ' -f1)" = "2a1bfda8121e8ac94d4f1456937a349ea03af98d82e745296aaec380d532b0e0"
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          cp MANIFEST.json /tmp/VANTA_CANONICAL_MANIFEST.json
      - name: Persist manifest only to producer branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          cp /tmp/VANTA_CANONICAL_MANIFEST.json MANIFEST.json
          git add MANIFEST.json
          git diff --cached --check
          git commit -m "ci(vanta): bind manifest to canonical gauntlet bytes"
          git push origin "HEAD:$HEAD_BRANCH"
