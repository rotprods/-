name: EXOVANT Gauntlet
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: origin-x100-manifest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifest-refresh-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Reconstruct exact ORIGIN producer manifest
        run: |
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/gauntlet.yml" > .github/workflows/gauntlet.yml
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          echo '---BEGIN_ORIGIN_MANIFEST---'
          cat MANIFEST.json
          echo '---END_ORIGIN_MANIFEST---'
          git diff --stat
