name: ORIGIN Native Pass Manifest Refresh
on:
  pull_request:
permissions:
  contents: write
jobs:
  manifest-refresh-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - name: Persist exact producer manifest on scratch branch
        run: |
          git fetch origin integration/origin-native-pass-manifest-refresh-003
          git switch -C integration/origin-native-pass-manifest-refresh-003 origin/integration/origin-native-pass-manifest-refresh-003
          git show "6e921d5ce77efde03057783851a7d13bea024dc5:.github/workflows/gauntlet.yml" > .github/workflows/gauntlet.yml
          python3 tools/project_control.py refresh
          python3 tools/project_control.py check
          git add MANIFEST.json
          git config user.name "EXOVANT Manifest Bot"
          git config user.email "261643698+rotprods@users.noreply.github.com"
          git commit -m "test(origin): generated native-pass manifest [skip ci]"
          git push origin HEAD:integration/origin-native-pass-manifest-refresh-003
