north_star: >-
  Make Campamento del Segundo Dia recognizable through everyday objects alone: a serviceable culture of clock synchronization, observation, route logging, repair and refuge life. Build a reusable proposal-level prop grammar without promoting unapproved props into canon.

canon_basis:
  - Campamento del Segundo Dia is an observatory and refuge
  - two observation stations carry divergent clocks
  - main mission requires synchronizing clocks and verifying repeated events
  - the world decision concerns which temporal records are preserved and who may use them
  - Aurora asset kit includes prairies, rings, mechanical clocks and bounded environmental duplicates
proposal_boundary:
  - exact everyday prop types, dimensions and assembly kits are production proposals derived from those functions
  - they do not establish new factions, rituals, economy, social hierarchy, named-character possessions, labels or iconography

includes:
  - clock synchronization and calibration objects
  - observation instrument service objects
  - route-recording and temporal-record handling objects
  - repair and maintenance props
  - refuge storage, seating and portable-light objects
  - controlled dimensional and open/closed/service variants where functional
  - pristine/used/damaged/abandoned history states on selected repeated families
  - deterministic functional clusters rather than random scatter
  - LOD, collision and interaction-clearance contracts for selected repeated props
  - material and manufacturing metadata
  - X100 QA, generator and receipts

excludes:
  - new lore or cultural ritual claims
  - combat equipment
  - named-character personal belongings without canon
  - AEON hero content
  - vegetation and fauna
  - terrain mutation
  - temporal runtime code
  - engine-specific interaction implementation before EXO-012

