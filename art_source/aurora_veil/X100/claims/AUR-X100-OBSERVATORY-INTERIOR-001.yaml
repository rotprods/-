north_star: >-
  Add Aurora's first real L3 interior system: a low, maintainable Observatorio del Umbral control-room/annex that reuses the Camp 4m construction language and X100 cultural props, exposes calibration/service/archive functions physically, and can generate multiple believable interior layouts without inventing new civilization lore.

canon_basis:
  - Campamento del Segundo Dia is an observatory and refuge.
  - Q_AURORA_M01 requires observatory calibration devices and route markers.
  - Aurora human infrastructure must be measured, serviceable and timing-oriented.
  - The future leaves physical receipts; no decorative clocks without function.

includes:
  - one 4m-grid control-room/annex shell proof adjacent to the observatory zone
  - modular interior floor, wall/service rail, console, cabinet, archive, cable-floor and instrument-support families
  - physically separated functional zones: calibration, route/archive, instrument service, observation/readout
  - reuse of qualified Camp X100 prop mesh families where semantically appropriate
  - central circulation and maintenance-clearance contracts
  - removable access/service panels and visible cable/data routing
  - used/repaired material-history metadata; no random grunge
  - deterministic layout variants/configuration rules
  - separate collision/clearance contracts, no loose collision render geometry
  - source generator + QA receipt + handoff

excludes:
  - moving or remodelling the existing 48m observatory ring/mast
  - AEON, antelope and Plain mission-site content
  - new named NPC/story outcomes
  - final gameplay/UI screens or readable text content
  - production-engine-specific interaction code before EXO-012
  - new civilization canon, rituals or social hierarchy

