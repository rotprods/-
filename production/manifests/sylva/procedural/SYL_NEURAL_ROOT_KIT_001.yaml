realism_contract:
  macro:
    - load paths are legible before surface detail
    - traversable roots have broad compressed crowns rather than hidden invisible walkways
    - junctions thicken where structural forces converge
  meso:
    - longitudinal deterministic growth ribs imply anisotropic biological growth
    - callus surfaces are separate editable interfaces
    - collision proxies are separated from render geometry
  micro:
    status: DEFERRED
    reason: "Micro bark breakup, scars, moisture, lichen and causal wear belong after macro/meso route validation; adding noise now would violate the anti-CGI contract."

