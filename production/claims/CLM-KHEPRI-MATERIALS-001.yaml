north_star: >-
  Build a KHEPRI-specific causal material system that multiplies credible L3-L5 world depth through
  manufacturing, use, heat, maintenance and repair rather than random grunge, while remaining reproducible,
  portable, engine-verifiable and clearly separated from final geology/architecture ownership.

includes:
  - causal PBR material families and controlled state variants
  - BaseColor / metallic-roughness / Normal / causal state masks
  - deterministic texture-generation source and seeds
  - UV/test geometry and calibration scene
  - packed/embedded source textures where practical
  - GLB export and Godot material/readback QA
  - family/state/scale combinatorial grammar
  - receipts, hashes, visual calibration evidence and handoff

excludes:
  - final Glass Sea architecture or final interpretation of its physical medium
  - terrain/geology ownership
  - fauna/NPC/vehicle modeling
  - gameplay, collision or navmesh
  - global/shared cross-world material libraries
  - atmospheric oxidation/weather chemistry while KHEPRI atmosphere is unknown
  - canon/story mutation
  - human final-art approval
  - target-hardware runtime texture budget until hardware gate

